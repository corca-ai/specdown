name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6

      - name: Check Go toolchain version drift
        run: ./scripts/check-go-version.sh

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'

      - name: Install verification tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Fast verification
        run: ./scripts/verify.sh fast

      - name: Coverage verification
        run: ./scripts/verify.sh coverage

      - name: Security verification
        run: ./scripts/verify.sh security

  release-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'

      - name: Install GoReleaser
        run: go install github.com/goreleaser/goreleaser/v2@v2.17.1

      - name: Release verification
        run: ./scripts/verify.sh release

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
